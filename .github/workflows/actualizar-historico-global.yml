name: Actualizar histórico global
on:
  workflow_dispatch:
  schedule:
    - cron: '50 7,20 * * *'
permissions:
  contents: write
concurrency:
  group: historico-global
  cancel-in-progress: false
jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Generar histórico común
        run: python scripts/update_historico_global.py
      - name: Publicar cambios
        run: |
          if git diff --quiet -- data/historico_global.json && [ -z "$(git ls-files --others --exclude-standard -- data/historico_global.json)" ]; then
            echo "Sin cambios"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico_global.json
          git commit -m "Datos: actualizar histórico global"
          for intento in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "Reintentando publicación ($intento/3)..."
            sleep $((intento * 3))
          done
          exit 1
