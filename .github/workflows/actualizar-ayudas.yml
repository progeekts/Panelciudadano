name: Actualizar radar de ayudas

on:
  workflow_dispatch:
  schedule:
    # 07:15 y 19:15 UTC. La web muestra la hora real de revisión guardada en los datos.
    - cron: '15 7,19 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-ayudas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar BDNS
        run: python scripts/update_ayudas.py
      - name: Validar datos antes de publicar
        run: python scripts/validate_data.py data/ayudas.json
      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/ayudas.json
          if git diff --cached --quiet -- data/ayudas.json; then
            echo "Sin cambios en ayudas"
            exit 0
          fi
          git commit -m "Datos: actualizar ayudas BDNS"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Reintentando publicación ($i/3)…"
            sleep 3
          done
          echo "No se pudo publicar tras 3 intentos"
          exit 1
