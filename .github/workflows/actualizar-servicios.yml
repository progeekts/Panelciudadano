name: Actualizar servicios digitales

on:
  workflow_dispatch:
  schedule:
    - cron: '5,35 * * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-servicios
  cancel-in-progress: true

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar estados oficiales
        run: python scripts/update_servicios.py
      - name: Validar datos antes de publicar
        run: python scripts/validate_data.py data/servicios.json data/historico_servicios.json
      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/servicios.json data/historico_servicios.json
          if git diff --cached --quiet -- data/servicios.json data/historico_servicios.json; then
            echo "Sin cambios en servicios"
            exit 0
          fi
          git commit -m "Datos: actualizar servicios e histórico"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Reintentando publicación ($i/3)…"
            sleep 3
          done
          echo "No se pudo publicar tras 3 intentos"
          exit 1
