name: Actualizar radar de estafas

on:
  workflow_dispatch:
  schedule:
    - cron: '35 7,19 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-estafas
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Consultar alertas oficiales
        run: python scripts/update_estafas.py

      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/estafas.json
          if git diff --cached --quiet -- data/estafas.json; then
            echo "Sin cambios en estafas"
            exit 0
          fi
          git commit -m "Datos: actualizar alertas de estafas"
          git push
