name: Actualizar alertas sanitarias

on:
  workflow_dispatch:
  schedule:
    - cron: '55 7,19 * * *'

permissions:
  contents: write

concurrency:
  group: actualizar-salud
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Consultar alertas oficiales AEMPS
        run: python scripts/update_salud.py
      - name: Publicar cambios si existen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data/salud.json
          if git diff --cached --quiet -- data/salud.json; then
            echo "Sin cambios en alertas sanitarias"
            exit 0
          fi
          git commit -m "Datos: actualizar alertas sanitarias AEMPS"
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            echo "Reintentando publicación ($i/3)…"
            sleep 3
          done
          exit 1
