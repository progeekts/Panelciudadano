name: Exportar y desplegar web

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Actualizar servicios digitales"
      - "Actualizar ayudas BDNS"
      - "Actualizar estafas"
      - "Actualizar alimentación"
      - "Actualizar salud"
      - "Actualizar meteorología"
      - "Actualizar movilidad"
      - "Actualizar histórico global"
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'metodologia.html'
      - 'privacidad.html'
      - 'assets/**'
      - 'data/**'
      - '.github/workflows/exportar-hosting.yml'
  schedule:
    - cron: '20 * * * *'

permissions:
  contents: read

concurrency:
  group: desplegar-hosting
  cancel-in-progress: true

jobs:
  exportar-y-desplegar:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Agrupar actualizaciones recientes
        if: github.event_name == 'workflow_run'
        shell: bash
        run: |
          # Ventana corta de debounce: deja que otros recolectores que estén terminando
          # actualicen main antes de construir una única versión consolidada.
          sleep 45

      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Resolver versión a publicar
        id: version
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Preparar paquete estático
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cp index.html metodologia.html privacidad.html dist/
          cp -R assets dist/assets
          cp -R data dist/data\n          python scripts/update_source_health.py --data-dir data --out dist/data/source_health.json

          cat > dist/.htaccess <<'EOF'
          Options -Indexes
          AddDefaultCharset UTF-8

          <IfModule mod_headers.c>
            Header set X-Content-Type-Options "nosniff"
            Header set Referrer-Policy "strict-origin-when-cross-origin"
            Header set Permissions-Policy "geolocation=(), microphone=(), camera=()"
          </IfModule>

          <IfModule mod_expires.c>
            ExpiresActive On
            ExpiresByType text/css "access plus 1 hour"
            ExpiresByType application/javascript "access plus 1 hour"
            ExpiresByType application/json "access plus 5 minutes"
          </IfModule>
          EOF

          cat > dist/DEPLOY.txt <<EOF
          Panel Ciudadano - paquete estático exportable
          Commit: $(git rev-parse HEAD)
          Generado: $(date -u +'%Y-%m-%dT%H:%M:%SZ')
          EOF

          git rev-parse HEAD | tr -d '\n' > dist/deploy-version.txt

      - name: Publicar artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: panel-ciudadano-web
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Comprobar configuración SFTP
        id: sftp
        shell: bash
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          USERNAME: ${{ secrets.DEPLOY_USER }}
          PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          if [ -n "$HOST" ] && [ -n "$USERNAME" ] && [ -n "$PASSWORD" ] && [ -n "$REMOTE_PATH" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Paquete generado. Despliegue SFTP omitido porque faltan secretos DEPLOY_*."
          fi

      - name: Instalar cliente SFTP
        if: steps.sftp.outputs.enabled == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Guardar copia de la versión pública actual
        if: steps.sftp.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          rm -rf previous
          mkdir -p previous
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "sftp://$DEPLOY_HOST:$PORT" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --verbose "$DEPLOY_PATH" previous/
          bye
          EOF

      - name: Desplegar por SFTP
        if: steps.sftp.outputs.enabled == 'true'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "sftp://$DEPLOY_HOST:$PORT" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose dist/ "$DEPLOY_PATH"
          bye
          EOF

      - name: Verificar publicación
        id: verify
        if: steps.sftp.outputs.enabled == 'true'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_SHA: ${{ steps.version.outputs.sha }}
        run: |
          set -euo pipefail
          BASE_URL="https://progeekts.es/panelciudadano"

          # El hosting/CDN puede tardar unos segundos en reflejar el nuevo fichero.
          for attempt in 1 2 3 4 5 6; do
            STATUS="$(curl -L -sS -o /tmp/index.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE_URL/")" || STATUS="000"
            VERSION="$(curl -L -fsS --connect-timeout 10 --max-time 20 "$BASE_URL/deploy-version.txt?ts=$(date +%s)" 2>/dev/null || true)"

            if [ "$STATUS" = "200" ] && [ "$VERSION" = "$EXPECTED_SHA" ]; then
              echo "Publicación verificada: HTTP 200 y versión $EXPECTED_SHA."
              exit 0
            fi

            echo "Intento $attempt/6: HTTP=$STATUS versión_publicada=$VERSION"
            sleep 10
          done

          echo "::error::El SFTP terminó, pero la versión publicada no coincide con el commit esperado o la portada no responde HTTP 200."
          exit 1

      - name: Recuperar versión pública anterior
        if: steps.sftp.outputs.enabled == 'true' && steps.verify.outcome == 'failure'
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_PORT:-22}"
          if [ ! -s previous/index.html ]; then
            echo "::error::No existe una copia anterior válida con index.html; no se realiza rollback automático."
            exit 1
          fi
          echo "::warning::La nueva publicación no superó la verificación. Restaurando la versión pública anterior."
          lftp -u "$DEPLOY_USER","$DEPLOY_PASSWORD" "sftp://$DEPLOY_HOST:$PORT" <<EOF
          set sftp:auto-confirm yes
          set net:max-retries 2
          set net:timeout 20
          mirror --reverse --delete --verbose previous/ "$DEPLOY_PATH"
          bye
          EOF

      - name: Verificar recuperación
        if: steps.sftp.outputs.enabled == 'true' && steps.verify.outcome == 'failure'
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="https://progeekts.es/panelciudadano"
          for attempt in 1 2 3 4 5 6; do
            STATUS="$(curl -L -sS -o /tmp/rollback-index.html -w '%{http_code}' --connect-timeout 10 --max-time 20 "$BASE_URL/?rollback=$(date +%s)")" || STATUS="000"
            if [ "$STATUS" = "200" ] && [ -s /tmp/rollback-index.html ]; then
              echo "Rollback verificado: la versión anterior vuelve a responder HTTP 200."
              break
            fi
            echo "Comprobando recuperación ($attempt/6): HTTP=$STATUS"
            sleep 10
          done
          if [ "$STATUS" != "200" ]; then
            echo "::error::La recuperación automática no pudo verificarse."
            exit 1
          fi
          echo "::error::La publicación nueva falló y se restauró la versión anterior. Se marca el workflow como fallido para hacerlo visible."
          exit 1
